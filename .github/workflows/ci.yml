name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

      - name: Build container image
        run: docker build --tag conveyance:ci .

      - name: Container startup and shutdown smoke test
        shell: bash
        run: |
          set -euo pipefail
          container_name="conveyance-ci-smoke"
          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --name "$container_name" --detach conveyance:ci
          sleep 3

          running="$(docker inspect --format '{{.State.Running}}' "$container_name")"
          if [ "$running" != "true" ]; then
            docker logs "$container_name"
            echo "container stopped before startup verification"
            exit 1
          fi

          docker stop --time 10 "$container_name"
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$container_name")"
          if [ "$exit_code" != "0" ]; then
            docker logs "$container_name"
            echo "container exited with status $exit_code"
            exit 1
          fi
